name: Render Reports

# Verifies that each project's .Rmd source still knits cleanly, using package
# versions pinned by renv.lock. See issue #3.
#
# NOTE: this workflow will not pass until the .Rmd sources in Project_I/II/III
# are real R Markdown (see issue #4) and renv.lock has been generated against
# them with `renv::snapshot()` (see renv.lock's header comment). It is wired up
# now so it activates automatically once those are fixed — no workflow changes
# needed at that point.

on:
  push:
    branches: [main]
    paths:
      - "Project_*/**/*.Rmd"
      - "renv.lock"
      - ".github/workflows/render-reports.yml"
  pull_request:
    branches: [main]
    paths:
      - "Project_*/**/*.Rmd"
      - "renv.lock"
      - ".github/workflows/render-reports.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - dir: Project_I
            rmd: Vishesh_Srivastava_ICS_P1_code.Rmd
          - dir: Project_II
            rmd: Vishesh_Srivastava_ICS_P2_code.Rmd
          - dir: Project_III
            rmd: Vishesh_Srivastava_ICS_P3_code.Rmd
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Knit ${{ matrix.project.dir }} report
        run: |
          rmarkdown::render(
            file.path("${{ matrix.project.dir }}", "${{ matrix.project.rmd }}"),
            output_format = "all"
          )
        shell: Rscript {0}

      - name: Upload rendered report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project.dir }}-rendered
          path: |
            ${{ matrix.project.dir }}/*.html
            ${{ matrix.project.dir }}/*.pdf
          if-no-files-found: ignore
